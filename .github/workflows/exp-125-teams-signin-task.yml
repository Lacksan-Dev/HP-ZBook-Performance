name: EXP-125 Teams sign-in scheduled task

on:
  pull_request:
    paths:
      - 'controller/providers/TeamsSigninScheduledTaskDisable.ps1'
      - 'controller/tests/TeamsSigninScheduledTaskDisable*.Tests.ps1'
      - '.github/workflows/exp-125-teams-signin-task.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pester:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Pester
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force
      - name: Validate EXP-125 provider
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = @(
            'controller/tests/TeamsSigninScheduledTaskDisable.Tests.ps1',
            'controller/tests/TeamsSigninScheduledTaskDisable.Integration.Tests.ps1'
          )
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config
