name: EXP-079 Edge Startup Boost

on:
  pull_request:
    paths:
      - 'controller/providers/EdgeStartupBoostEnabledPolicy.ps1'
      - 'controller/tests/EXP-079.EdgeStartupBoostEnabledPolicy*.Tests.ps1'
      - '.github/workflows/exp-079-edge-startup-boost.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pester:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Pester
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force
      - name: Validate EXP-079 provider
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = @(
            'controller/tests/EXP-079.EdgeStartupBoostEnabledPolicy.Tests.ps1',
            'controller/tests/EXP-079.EdgeStartupBoostEnabledPolicy.Integration.Tests.ps1'
          )
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config
