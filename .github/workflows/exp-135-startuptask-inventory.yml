name: EXP-135 StartupTask inventory

on:
  pull_request:
    paths:
      - 'controller/research/NonAllowlistedStartupTaskInventory.ps1'
      - 'controller/tests/NonAllowlistedStartupTaskInventory.Tests.ps1'
      - 'controller/tests/NonAllowlistedStartupTaskInventory.Integration.Tests.ps1'
      - '.github/workflows/exp-135-startuptask-inventory.yml'

permissions:
  contents: read

jobs:
  pester:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pester
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck
      - name: Run focused contracts
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 5.5.0
          $result = Invoke-Pester -Path @(
            'controller/tests/NonAllowlistedStartupTaskInventory.Tests.ps1',
            'controller/tests/NonAllowlistedStartupTaskInventory.Integration.Tests.ps1'
          ) -PassThru
          if ($result.FailedCount -gt 0) { throw "Pester failures: $($result.FailedCount)" }
