name: EXP-066 HP Network HSA Manual

on:
  pull_request:
    paths:
      - 'controller/providers/HPNetworkCapManual.ps1'
      - 'controller/tests/HPNetworkCapManual*.Tests.ps1'
      - '.github/workflows/exp-066-hp-network-hsa-manual.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pester:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Pester
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force
      - name: Validate EXP-066 provider
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = @(
            'controller/tests/HPNetworkCapManual.Tests.ps1',
            'controller/tests/HPNetworkCapManual.Integration.Tests.ps1'
          )
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config
