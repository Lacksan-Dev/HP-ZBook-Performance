name: EXP-156 shopping assistant validation harness

on:
  pull_request:
    paths:
      - 'experiments/EXP-156/Invoke-Exp156LabHarness.ps1'
      - 'experiments/EXP-156/Invoke-Exp156LabHarness*.Tests.ps1'
      - '.github/workflows/exp-156-shopping-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pester:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Pester
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force
      - name: Validate EXP-156 harness
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = @(
            'experiments/EXP-156/Invoke-Exp156LabHarness.Tests.ps1',
            'experiments/EXP-156/Invoke-Exp156LabHarness.Integration.Tests.ps1'
          )
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config
