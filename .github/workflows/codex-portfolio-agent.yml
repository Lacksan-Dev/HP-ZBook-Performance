name: Codex portfolio agent

on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - '.codex/**'
      - 'portfolio/**'
      - 'experiments/EXP-065/Invoke-Exp065HpSystemInfo.ps1'
      - 'experiments/EXP-065/Invoke-Exp065HpSystemInfo.Tests.ps1'
      - 'experiments/EXP-065/Invoke-Exp065LabHarness.ps1'
      - 'experiments/EXP-065/Invoke-Exp065LabHarness.Tests.ps1'
      - 'experiments/EXP-067/**'
      - 'experiments/EXP-087/**'
      - 'experiments/EXP-154/**'
      - 'experiments/EXP-162/**'
      - 'controller/providers/LogitechDownloadAssistantDemandLaunch.ps1'
      - 'controller/tests/LogitechDownloadAssistantDemandLaunch*.Tests.ps1'
      - 'controller/providers/SetPointEventManagerDemandLaunch.ps1'
      - 'controller/tests/SetPointEventManagerDemandLaunch*.Tests.ps1'
      - 'controller/providers/HpHotkeyUwpDelayedStart.ps1'
      - 'controller/tests/HpHotkeyUwpDelayedStart*.Tests.ps1'
      - 'controller/providers/ClassicTeamsDemandLaunch.ps1'
      - 'controller/tests/ClassicTeamsDemandLaunch*.Tests.ps1'
      - 'controller/providers/LogiBoltDemandLaunch.ps1'
      - 'controller/tests/LogiBoltDemandLaunch*.Tests.ps1'
      - 'controller/providers/LogiOptionsPlusDemandLaunch.ps1'
      - 'controller/tests/LogiOptionsPlusDemandLaunch*.Tests.ps1'
      - 'controller/providers/LogiTuneDemandLaunch.ps1'
      - 'controller/tests/LogiTuneDemandLaunch*.Tests.ps1'
      - 'controller/providers/LogiTuneSigninTask.ps1'
      - 'controller/tests/LogiTuneSigninTask*.Tests.ps1'
      - 'controller/providers/InventoryBoundRunRegistrationRemoval.ps1'
      - 'controller/tests/InventoryBoundRunRegistrationRemoval*.Tests.ps1'
      - 'controller/providers/InventoryBoundSigninTaskRemoval.ps1'
      - 'controller/tests/InventoryBoundSigninTaskRemoval*.Tests.ps1'
      - 'controller/providers/InventoryBoundStartupFolderRemoval.ps1'
      - 'controller/tests/InventoryBoundStartupFolderRemoval*.Tests.ps1'
      - 'controller/providers/EdgeDisableCopilotAddressBarSuggestions.ps1'
      - 'controller/tests/EdgeDisableCopilotAddressBarSuggestions*.Tests.ps1'
      - 'controller/providers/EdgeDisableAddressBarClipboardSuggestions.ps1'
      - 'controller/tests/EdgeDisableAddressBarClipboardSuggestions*.Tests.ps1'
      - 'controller/providers/EdgeDisableShoppingAssistant.ps1'
      - 'controller/tests/EdgeDisableShoppingAssistant*.Tests.ps1'
      - 'controller/providers/EdgeDisableTextPrediction.ps1'
      - 'controller/tests/EdgeDisableTextPrediction*.Tests.ps1'
      - 'controller/providers/EdgeRequireHardwareAcceleration.ps1'
      - 'controller/tests/EdgeRequireHardwareAcceleration*.Tests.ps1'
      - 'controller/providers/EdgeSleepingTabsTimeout15Minutes.ps1'
      - 'controller/tests/EdgeSleepingTabsTimeout15Minutes*.Tests.ps1'
      - 'controller/providers/EdgeDisableNetworkPrediction.ps1'
      - 'controller/tests/EdgeDisableNetworkPrediction*.Tests.ps1'
      - 'controller/tests/EXP-154.StartupTaskRollbackGate*.Tests.ps1'
      - '.github/workflows/codex-portfolio-agent.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pester:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Pester
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force
      - name: Validate the Codex portfolio agent and Experimental providers
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = @(
            '.codex/tests/ExperimentDiscoveryPortfolio.Tests.ps1',
            'experiments/EXP-065/Invoke-Exp065HpSystemInfo.Tests.ps1',
            'experiments/EXP-065/Invoke-Exp065LabHarness.Tests.ps1',
            'experiments/EXP-067/Invoke-Exp067HpDiagnostics.Tests.ps1',
            'experiments/EXP-067/Invoke-Exp067HpDiagnostics.Integration.Tests.ps1',
            'experiments/EXP-087/Invoke-Exp087LabHarness.Tests.ps1',
            'experiments/EXP-087/Invoke-Exp087LabHarness.Integration.Tests.ps1',
            'experiments/EXP-162/Invoke-Exp162ScheduledTaskRegistration.Tests.ps1',
            'experiments/EXP-162/Invoke-Exp162ScheduledTaskRegistration.Integration.Tests.ps1',
            'controller/tests/LogitechDownloadAssistantDemandLaunch.Tests.ps1',
            'controller/tests/LogitechDownloadAssistantDemandLaunch.Integration.Tests.ps1',
            'controller/tests/SetPointEventManagerDemandLaunch.Tests.ps1',
            'controller/tests/SetPointEventManagerDemandLaunch.Integration.Tests.ps1',
            'controller/tests/HpHotkeyUwpDelayedStart.Tests.ps1',
            'controller/tests/HpHotkeyUwpDelayedStart.Integration.Tests.ps1',
            'controller/tests/ClassicTeamsDemandLaunch.Tests.ps1',
            'controller/tests/ClassicTeamsDemandLaunch.Integration.Tests.ps1',
            'controller/tests/LogiBoltDemandLaunch.Tests.ps1',
            'controller/tests/LogiBoltDemandLaunch.Integration.Tests.ps1',
            'controller/tests/LogiOptionsPlusDemandLaunch.Tests.ps1',
            'controller/tests/LogiOptionsPlusDemandLaunch.Integration.Tests.ps1',
            'controller/tests/LogiTuneDemandLaunch.Tests.ps1',
            'controller/tests/LogiTuneDemandLaunch.Integration.Tests.ps1',
            'controller/tests/LogiTuneSigninTask.Tests.ps1',
            'controller/tests/LogiTuneSigninTask.Integration.Tests.ps1',
            'controller/tests/InventoryBoundRunRegistrationRemoval.Tests.ps1',
            'controller/tests/InventoryBoundRunRegistrationRemoval.Integration.Tests.ps1',
            'controller/tests/InventoryBoundSigninTaskRemoval.Tests.ps1',
            'controller/tests/InventoryBoundSigninTaskRemoval.Integration.Tests.ps1',
            'controller/tests/InventoryBoundStartupFolderRemoval.Tests.ps1',
            'controller/tests/InventoryBoundStartupFolderRemoval.Integration.Tests.ps1',
            'controller/tests/EdgeDisableCopilotAddressBarSuggestions.Tests.ps1',
            'controller/tests/EdgeDisableCopilotAddressBarSuggestions.Integration.Tests.ps1',
            'controller/tests/EdgeDisableAddressBarClipboardSuggestions.Tests.ps1',
            'controller/tests/EdgeDisableAddressBarClipboardSuggestions.Integration.Tests.ps1',
            'controller/tests/EdgeDisableShoppingAssistant.Tests.ps1',
            'controller/tests/EdgeDisableShoppingAssistant.Integration.Tests.ps1',
            'controller/tests/EdgeDisableTextPrediction.Tests.ps1',
            'controller/tests/EdgeDisableTextPrediction.Integration.Tests.ps1',
            'controller/tests/EdgeRequireHardwareAcceleration.Tests.ps1',
            'controller/tests/EdgeRequireHardwareAcceleration.Integration.Tests.ps1',
            'controller/tests/EdgeSleepingTabsTimeout15Minutes.Tests.ps1',
            'controller/tests/EdgeSleepingTabsTimeout15Minutes.Integration.Tests.ps1',
            'controller/tests/EdgeDisableNetworkPrediction.Tests.ps1',
            'controller/tests/EdgeDisableNetworkPrediction.Integration.Tests.ps1',
            'controller/tests/EXP-154.StartupTaskRollbackGate.Tests.ps1',
            'controller/tests/EXP-154.StartupTaskRollbackGate.Integration.Tests.ps1'
          )
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config
