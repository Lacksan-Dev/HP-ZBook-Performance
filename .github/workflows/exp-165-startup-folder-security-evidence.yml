name: EXP-165 Startup Folder Security Evidence

on:
  pull_request:
    paths:
      - 'experiments/EXP-143/Invoke-StartupRegistrationInventory.ps1'
      - 'experiments/EXP-143/Invoke-StartupRegistrationInventory*.Tests.ps1'
      - '.github/workflows/exp-165-startup-folder-security-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pester:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Pester
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force
      - name: Validate EXP-165 inventory refinement
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = @(
            'experiments/EXP-143/Invoke-StartupRegistrationInventory.Tests.ps1',
            'experiments/EXP-143/Invoke-StartupRegistrationInventory.Integration.Tests.ps1'
          )
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config
